<title>Ciné Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Mise en page : une seule colonne façon appli mobile, salle de cinéma dans le noir, pile d'affiches au centre. */
:root {
  --bg: #120d14;         /* velours de salle */
  --surface: #1d1620;
  --line: #34293a;
  --fg: #f4ece6;
  --muted: #a8979f;
  --accent: #ff4d5e;     /* rouge siège de cinéma */
  --yes: #39d98a;
  --no: #ff5d6c;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body);
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
.app { max-width: 460px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding: 14px 16px 18px; gap: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font: 900 30px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: baseline; gap: 6px; }
.brand b { color: var(--accent); }
.ticket { font: 700 13px/1 var(--display); letter-spacing: .14em; border: 1.5px dashed var(--muted); color: var(--muted); padding: 7px 10px; border-radius: 4px; background: none; }

h1, h2 { font-family: var(--display); text-transform: uppercase; text-wrap: balance; margin: 0; }
h1 { font-size: 46px; line-height: .95; font-weight: 900; }
h2 { font-size: 22px; font-weight: 800; letter-spacing: .03em; }
.lead { color: var(--muted); margin: 0; max-width: 34ch; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.stack-v { display: flex; flex-direction: column; gap: 12px; }

.btn { border: 0; border-radius: 999px; padding: 14px 20px; font-weight: 700; font-size: 16px; background: var(--accent); color: #1a0a0d; }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--fg); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 auto; }

input.code { width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; color: var(--fg);
  font: 800 28px/1 var(--display); letter-spacing: .3em; text-transform: uppercase; text-align: center; }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; padding: 11px 6px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

.chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.chip { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; text-align: left; }
.chip .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; }
.chip .n { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, var(--surface)); }
.chip[aria-pressed="false"] { opacity: .55; }

.note { font-size: 12.5px; color: var(--muted); margin: 0; }
.err { color: var(--no); font-size: 14px; margin: 0; min-height: 1.2em; }

/* Salon */
.roombar { display: flex; align-items: center; gap: 10px; }
.people { display: flex; }
.people img { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--bg); margin-left: -8px; background: var(--surface); }
.people img:first-child { margin-left: 0; }
.roombar .who { font-size: 13px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); padding: 4px; border-radius: 12px; }
.tabs button { border: 0; background: none; padding: 10px; border-radius: 9px; font-weight: 600; color: var(--muted); display: flex; justify-content: center; gap: 8px; align-items: center; }
.tabs button[aria-selected="true"] { background: var(--line); color: var(--fg); }
.badge { background: var(--accent); color: #1a0a0d; border-radius: 999px; font-size: 12px; padding: 1px 8px; font-weight: 700; font-variant-numeric: tabular-nums; }

.deck { position: relative; flex: 1; min-height: 430px; }
.card { position: absolute; inset: 0; border-radius: 22px; overflow: hidden; touch-action: none; user-select: none;
  background: var(--surface); box-shadow: 0 18px 40px rgba(0,0,0,.45); display: flex; flex-direction: column; will-change: transform; }
.card.behind { transform: scale(.95) translateY(14px); filter: brightness(.6); }
.poster { flex: 1; position: relative; padding: 18px; display: flex; flex-direction: column; justify-content: space-between;
  background: radial-gradient(120% 80% at 20% 10%, hsl(var(--h1) 75% 55%), transparent 60%),
              linear-gradient(160deg, hsl(var(--h2) 60% 32%), hsl(var(--h2) 55% 10%)); }
.poster::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .18;
  background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0 1px, transparent 1px 3px); }
.art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
.poster.has-art .ttl { display: none; }
.poster.has-art::after { opacity: 1; background: linear-gradient(rgba(0,0,0,.45), transparent 22%, transparent 75%, rgba(0,0,0,.35)); }
.info .name { font: 800 24px/1 var(--display); text-transform: uppercase; text-wrap: balance; }
.credit { font-size: 11px; color: var(--muted); opacity: .7; margin: 0; }
.poster .meta { display: flex; justify-content: space-between; gap: 8px; align-items: center; position: relative; z-index: 1; }
.pill { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; background: rgba(0,0,0,.35); color: #fff; }
.pill.plat { background: var(--c); color: #111; }
.poster .ttl { font: 900 clamp(38px, 12vw, 54px)/.9 var(--display); text-transform: uppercase; color: #fff; text-wrap: balance;
  text-shadow: 0 2px 18px rgba(0,0,0,.4); position: relative; z-index: 1; overflow-wrap: anywhere; }
.info { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 6px; }
.info .facts { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.info p { margin: 0; }
.stamp { position: absolute; top: 26px; z-index: 2; font: 900 34px/1 var(--display); letter-spacing: .08em; padding: 4px 12px; border: 4px solid; border-radius: 8px; opacity: 0; text-transform: uppercase; }
.stamp.yes { left: 20px; color: var(--yes); transform: rotate(-12deg); }
.stamp.no { right: 20px; color: var(--no); transform: rotate(12deg); }

.actions { display: flex; justify-content: center; gap: 26px; }
.round { width: 68px; height: 68px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.round svg { width: 30px; height: 30px; }
.round.no { color: var(--no); } .round.yes { color: var(--yes); }
.round:active { transform: scale(.93); }

.empty { flex: 1; display: grid; place-items: center; text-align: center; padding: 30px 10px; border: 1.5px dashed var(--line); border-radius: 22px; }
.empty > div { display: flex; flex-direction: column; gap: 10px; align-items: center; }

.list { display: flex; flex-direction: column; gap: 10px; }
.item { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; background: var(--surface); border-radius: 14px; padding: 10px; }
.thumb { width: 56px; height: 76px; border-radius: 8px; overflow: hidden; position: relative; background: linear-gradient(160deg, hsl(var(--h1) 70% 50%), hsl(var(--h2) 55% 14%)); }
.item .t { font: 800 20px/1 var(--display); text-transform: uppercase; }
.item .s { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.item .perfect { color: var(--yes); font-weight: 700; }
.item > div { min-width: 0; }

/* Écran « C'est un match » */
.overlay { position: fixed; inset: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px);
  display: grid; place-items: center; padding: 24px 16px; text-align: center; }
.overlay .box { display: flex; flex-direction: column; gap: 14px; align-items: center; max-width: 360px; }
.overlay .big { font: 900 64px/.85 var(--display); text-transform: uppercase; color: var(--accent); transform: rotate(-4deg); }
.overlay .thumb { width: 130px; height: 176px; border-radius: 14px; }

@media (prefers-reduced-motion: no-preference) {
  .overlay .big { animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: rotate(-4deg) scale(.4); opacity: 0; } }
}

/* Filtres de la bibliothèque */
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.tag .n { font-weight: 500; opacity: .7; margin-left: 4px; font-variant-numeric: tabular-nums; }
.tag[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tag:disabled { opacity: .3; }
select.pick { width: 100%; background: var(--surface); color: var(--fg); border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 12px; font: 600 15px var(--body); }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 13px; padding: 0; }
.sticky { position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 30%); }
.score { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--fg); }
.pill.score { background: rgba(0,0,0,.45); }
.summary { font-size: 12.5px; color: var(--muted); }
</style>

// ---------- Filtres ----------
// Listes vides = « tout » ; director vide = tout le monde.
const defaultFilters = () => ({ type: "both", platforms: Object.keys(PLATFORMS), genres: [], decades: [], director: "", tier: 0 });
const withDefaults = (r) => ({ ...defaultFilters(), ...r });
function matchesFilters(f, x, skip) {
  return (skip === "type" || x.type === "both" || f.k === x.type)
    && (skip === "platforms" || x.platforms.includes(f.p))
    && (skip === "genres" || !x.genres.length || f.g.some((g) => x.genres.includes(g)))
    && (skip === "decades" || !x.decades.length || x.decades.includes(f.dec))
    && (skip === "director" || !x.director || f.people.includes(x.director))
    && (skip === "tier" || f.tier >= x.tier);
}
const filtered = (x) => CATALOG.filter((f) => matchesFilters(f, x));
// Combien de titres on aurait en ajoutant cette valeur, tous les autres filtres restant les mêmes.
const countFor = (x, key, test) => CATALOG.filter((f) => matchesFilters(f, x, key) && test(f)).length;
function summary(x) {
  const parts = [x.type === "f" ? "Films" : x.type === "s" ? "Séries" : "Films et séries"];
  if (x.platforms.length < Object.keys(PLATFORMS).length) parts.push(x.platforms.map((k) => PLATFORMS[k].name).join(", "));
  if (x.genres.length) parts.push(x.genres.map((g) => GENRES[g]).join(", "));
  if (x.decades.length) parts.push(DECADES.filter(([k]) => x.decades.includes(k)).map(([, l]) => l).join(", "));
  if (x.director) parts.push(x.director);
  if (x.tier) parts.push(TIERS[x.tier][1]);
  return parts.join(" · ");
}

  if (!S.ready) { app.innerHTML = head + `<p class="lead">Ouverture de la salle…</p>`; return; }

function createView() {
  const x = S.draft;
  const norm = (f) => f.k === "f" ? f.r / 5 : f.r / 10;
  const list = filtered(x).sort((a, b) => norm(b) - norm(a));
  const n = list.length;
  const seg = (attr, opts, cur) => opts.map(([v, l]) => `<button data-${attr}="${v}" aria-pressed="${String(cur) === v}">${l}</button>`).join("");
  const chips = Object.entries(PLATFORMS).map(([k, p]) =>
    `<button class="chip" style="--c:${p.c}" data-plat="${k}" aria-pressed="${x.platforms.includes(k)}"><span class="dot"></span>${p.name}<span class="n">${countFor(x, "platforms", (f) => f.p === k)}</span></button>`).join("");
  const tags = (attr, entries, sel, key, test) => entries.map(([k, l]) => {
    const c = countFor(x, key, (f) => test(f, k));
    return `<button class="tag" data-${attr}="${k}" aria-pressed="${sel.includes(k)}" ${c || sel.includes(k) ? "" : "disabled"}>${l}<span class="n">${c}</span></button>`;
  }).join("");
  // Liste des réalisateurs et créateurs, avec le nombre de titres qui passent les autres filtres.
  const people = {};
  for (const f of CATALOG) if (matchesFilters(f, x, "director")) for (const p of f.people) people[p] = (people[p] || 0) + 1;
  if (x.director && !people[x.director]) people[x.director] = 0;
  const opts = Object.entries(people).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "fr"))
    .map(([p, c]) => `<option value="${esc(p)}" ${p === x.director ? "selected" : ""}>${esc(p)} (${c})</option>`).join("");
  const reset = (key) => `<button class="link" data-reset="${key}">Tout</button>`;

  return `<section class="stack-v"><h2>Bibliothèque</h2><p class="lead">Réglez les filtres : le salon ne proposera que les titres qui y correspondent.</p></section>
  <section class="stack-v"><span class="label">Type</span><div class="seg" role="group" aria-label="Type">${seg("type", [["f", "Films"], ["s", "Séries"], ["both", "Les deux"]], x.type)}</div></section>
  <section class="stack-v"><span class="label">Plateformes</span><div class="chips">${chips}</div></section>
  <section class="stack-v"><div class="sec-head"><span class="label">Genres</span>${x.genres.length ? reset("genres") : ""}</div>
    <div class="tags">${tags("genre", Object.entries(GENRES), x.genres, "genres", (f, k) => f.g.includes(k))}</div></section>
  <section class="stack-v"><div class="sec-head"><span class="label">Époque</span>${x.decades.length ? reset("decades") : ""}</div>
    <div class="tags">${tags("dec", DECADES, x.decades, "decades", (f, k) => f.dec === k)}</div></section>
  <section class="stack-v"><label class="label" for="director">Réalisation / création</label>
    <select class="pick" id="director"><option value="">Tout le monde</option>${opts}</select></section>
  <section class="stack-v"><span class="label">Notes</span><div class="seg" role="group" aria-label="Notes">${seg("tier", TIERS, x.tier)}</div>
    <p class="note">Tous les titres sont très bien notés (films : Letterboxd, au moins 3,7 sur 5 ; séries : IMDb, au moins 8 sur 10). « Excellents » : 4,1 ou 8,6 et plus. « Cultes » : 4,3 ou 8,9 et plus. Notes et plateformes en France approximatives : elles changent avec le temps. Affiches : Wikipédia.</p></section>
  <section class="stack-v"><button class="btn ghost" id="toggle-list" ${n ? "" : "disabled"}>${S.showList ? "Masquer" : "Voir"} les ${n} titres</button>
    ${S.showList ? `<div class="list">${list.map(itemHTML).join("")}</div>` : ""}</section>
  <div class="row sticky"><button class="btn ghost" id="back">Retour</button><button class="btn" id="create" ${n ? "" : "disabled"}>${n ? `Lancer (${n} titres)` : "Aucun titre"}</button></div>`;
}

function itemHTML(f, extra = "") {
  return `<div class="item"><div class="thumb" style="--h1:${f.h1};--h2:${f.h2}">${art(f)}</div>
    <div><div class="t">${esc(f.t)}</div><div class="s">${facts(f)}</div>
    <div class="s">${esc(byWho(f))} · ${PLATFORMS[f.p].name} · <span class="score">${score(f)}</span></div>${extra}</div></div>`;
}

function participants() {
  const ids = Object.keys(S.votes);
  if (S.me && !ids.includes(S.me)) ids.unshift(S.me);
  return ids;
}
function matches() {
  const ids = participants();
  const out = [];
  for (const f of S.deck) {
    const likers = ids.filter((id) => S.votes[id]?.[f.id] === 1);
    if (likers.length >= 2 || (S.solo && likers.length)) out.push({ f, likers, perfect: likers.length === ids.length });
  }
  return out.sort((a, b) => b.likers.length - a.likers.length);
}

function roomView() {
  const ids = participants();
  const mine = S.votes[S.me] || {};
  const left = S.deck.filter((f) => !(f.id in mine));
  const m = matches();
  const names = ids.map((id) => id === S.me ? "vous" : (S.profiles[id]?.name || "un ami"));
  const avatars = ids.slice(0, 6).map((id) => S.profiles[id]?.avatarUrl ? `<img src="${esc(S.profiles[id].avatarUrl)}" alt="">` : "").join("");
  const bar = `<div class="roombar"><div class="people">${avatars}</div><div class="who">${ids.length} dans la salle : ${esc(names.join(", "))}</div></div>
  <div class="summary">${esc(summary(S.room))}</div>
  <div class="tabs" role="tablist"><button role="tab" data-tab="swipe" aria-selected="${S.tab === "swipe"}">À trier · ${left.length}</button>
  <button role="tab" data-tab="matches" aria-selected="${S.tab === "matches"}">Matchs <span class="badge">${m.length}</span></button></div>`;

  let body;
  if (S.tab === "matches") {
    body = m.length ? `<div class="list">${m.map(({ f, likers, perfect }) => itemHTML(f,
      `<div class="s">${perfect ? `<span class="perfect">Tout le monde dit oui</span>` : `${likers.length} sur ${ids.length} disent oui`}</div>`)).join("")}</div>`
      : `<div class="empty"><div><h2>Pas encore de match</h2><p class="lead">Un match apparaît quand au moins deux personnes aiment le même titre.</p></div></div>`;
  } else if (!left.length) {
    body = `<div class="empty"><div><h2>Vous avez tout vu&nbsp;!</h2><p class="lead">${m.length ? `${m.length} match${m.length > 1 ? "s" : ""} pour l'instant.` : "Attendez que vos amis swipent."}</p>
      <button class="btn" data-tab="matches">Voir les matchs</button><button class="btn ghost" id="redo">Recommencer mes choix</button></div></div>`;
  } else {
    const card = (f, cls) => `<article class="card ${cls}" data-id="${f.id}" aria-label="${esc(f.t)}">
      <div class="poster ${POSTERS.has(f.id) ? "has-art" : ""}" style="--h1:${f.h1};--h2:${f.h2}">${art(f, true)}
        <span class="stamp yes">Oui</span><span class="stamp no">Non</span>
        <div class="meta"><span class="pill score">${score(f)}</span><span class="pill plat" style="--c:${PLATFORMS[f.p].c}">${PLATFORMS[f.p].name}</span></div>
        <div class="ttl">${esc(f.t)}</div>
      </div>
      <div class="info">${POSTERS.has(f.id) ? `<div class="name">${esc(f.t)}</div>` : ""}<div class="facts">${facts(f)}</div><div class="facts">${esc(byWho(f))}</div><p>${esc(f.pitch)}</p></div></article>`;
    body = `<div class="deck">${left[1] ? card(left[1], "behind") : ""}${card(left[0], "top")}</div>
      <div class="actions"><button class="round no" id="nope" aria-label="Non">${ICON.no}</button><button class="round yes" id="like" aria-label="Oui">${ICON.yes}</button></div>`;
  }
  const share = S.solo ? "" : `<p class="note">Invitez vos amis : ils ouvrent cette page, touchent « Rejoindre » et tapent <b>${S.code}</b>.</p>`;
  const ov = S.overlay ? `<div class="overlay" id="overlay" role="dialog" aria-label="C'est un match"><div class="box">
      <div class="big">C'est un match&nbsp;!</div><div class="thumb" style="--h1:${S.overlay.h1};--h2:${S.overlay.h2}">${art(S.overlay, true)}</div>
      <h2>${esc(S.overlay.t)}</h2><p class="lead">${facts(S.overlay)} · sur ${PLATFORMS[S.overlay.p].name}</p>
      <button class="btn" id="close-ov">Continuer</button></div></div>` : "";
  return bar + body + share + ov;
}

// ---------- Interactions ----------
const toggle = (arr, v) => arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v];
function bind() {
  const on = (id, fn) => { const el = $("#" + id); if (el) el.onclick = fn; };
  const all = (sel, fn) => document.querySelectorAll(sel).forEach((b) => b.onclick = () => { fn(b); render(); });
  on("go-create", () => { S.screen = "create"; render(); });
  on("back", () => { S.screen = "home"; render(); });
  on("leave", () => { leaveRoom(); S.screen = "home"; render(); });
  on("go-join", () => joinRoom(($("#join-code")?.value || "").trim().toUpperCase()));
  const jc = $("#join-code"); if (jc) jc.onkeydown = (e) => { if (e.key === "Enter") $("#go-join").click(); };
  on("create", createRoom);
  on("toggle-list", () => { S.showList = !S.showList; render(); });
  on("like", () => swipe(1));
  on("nope", () => swipe(0));
  on("redo", () => { S.votes[S.me] = {}; S.myVotes[S.code] = {}; saveVotes(); render(); });
  on("close-ov", () => { S.overlay = null; render(); });
  const d = S.draft;
  all("[data-type]", (b) => d.type = b.dataset.type);
  all("[data-tier]", (b) => d.tier = Number(b.dataset.tier));
  all("[data-plat]", (b) => d.platforms = toggle(d.platforms, b.dataset.plat));
  all("[data-genre]", (b) => d.genres = toggle(d.genres, b.dataset.genre));
  all("[data-dec]", (b) => d.decades = toggle(d.decades, b.dataset.dec));
  all("[data-reset]", (b) => d[b.dataset.reset] = []);
  all("[data-tab]", (b) => S.tab = b.dataset.tab);
  const sel = $("#director"); if (sel) sel.onchange = () => { d.director = sel.value; render(); };
  const top = $(".card.top"); if (top) drag(top);
}

function drag(el) {
  let x0 = 0, y0 = 0, dx = 0, dy = 0, active = false;
  const yes = $(".stamp.yes", el), no = $(".stamp.no", el);
  el.addEventListener("pointerdown", (e) => { active = true; x0 = e.clientX; y0 = e.clientY; el.setPointerCapture(e.pointerId); el.style.transition = "none"; });
  el.addEventListener("pointermove", (e) => {
    if (!active) return;
    dx = e.clientX - x0; dy = e.clientY - y0;
    el.style.transform = `translate(${dx}px, ${dy * .3}px) rotate(${dx / 18}deg)`;
    yes.style.opacity = Math.max(0, Math.min(1, dx / 90)); no.style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  const end = () => {
    if (!active) return; active = false;
    if (Math.abs(dx) > 100) swipe(dx > 0 ? 1 : 0, dx);
    else { el.style.transition = "transform .25s"; el.style.transform = ""; yes.style.opacity = no.style.opacity = 0; }
    dx = dy = 0;
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
}

function swipe(v, dx) {
  const el = $(".card.top"); if (!el || el.dataset.gone) return;
  el.dataset.gone = "1";
  const id = el.dataset.id;
  const dir = v ? 1 : -1;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  el.style.transition = reduce ? "opacity .15s" : "transform .3s ease-in, opacity .3s";
  el.style.transform = reduce ? "" : `translate(${dir * 600}px, ${dx ? 0 : -40}px) rotate(${dir * 25}deg)`;
  el.style.opacity = "0";
  $(v ? ".stamp.yes" : ".stamp.no", el).style.opacity = 1;
  setTimeout(() => {
    S.votes[S.me] = { ...(S.votes[S.me] || {}), [id]: v };
    S.myVotes[S.code] = S.votes[S.me];
    saveVotes();
    checkNewMatches();
    render();
  }, reduce ? 150 : 280);
}

document.addEventListener("keydown", (e) => {
  if (S.screen !== "room" || S.tab !== "swipe" || S.overlay || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") swipe(1);
  if (e.key === "ArrowLeft") swipe(0);
});

// Montre l'écran « match » quand un titre que j'aime vient d'atteindre 2 oui ou plus.
function checkNewMatches() {
  const now = new Set(matches().map((m) => m.f.id));
  if (S.knownMatches) {
    for (const id of now) if (!S.knownMatches.has(id) && S.votes[S.me]?.[id] === 1 && !S.solo) { S.overlay = BY_ID[id]; break; }
  }
  S.knownMatches = now;
}

// ---------- Salons et données partagées ----------
function enterRoom(code, raw) {
  const room = withDefaults(raw);
  S.code = code; S.room = room; S.screen = "room"; S.tab = "swipe"; S.knownMatches = null; S.overlay = null;
  // Même ordre pour tout le salon (tiré du code), pour que les matchs arrivent vite.
  const rnd = seeded(code);
  S.deck = filtered(room).map((f) => [rnd(), f]).sort((a, b) => a[0] - b[0]).map((x) => x[1]);
  S.votes = { [S.me]: S.myVotes[code] || {} };
  store.set("cinematch:last", code);
  if (S.solo) { checkNewMatches(); render(); return; }
  if (!S.myVotes[code]) { S.myVotes[code] = {}; saveVotes(); }
  S.unsubVotes = S.db.collection("votes").onSnapshot(async (snap) => {
    const next = {};
    for (const d of snap.docs) { const r = d.data()?.rooms?.[code]; if (r) next[d.id] = r; }
    next[S.me] = S.votes[S.me] || {};
    S.votes = next;
    const unknown = Object.keys(next).filter((id) => !S.profiles[id]);
    if (unknown.length && S.user) { try { Object.assign(S.profiles, await S.user.profiles(unknown)); } catch {} }
    checkNewMatches();
    if (!$(".card.top")?.dataset.gone) render();
  }, () => {});
  render();
}

function leaveRoom() {
  S.unsubVotes?.(); S.unsubVotes = null;
  S.code = null; S.room = null; S.overlay = null;
  store.set("cinematch:last", null);
}

async function createRoom() {
  const x = S.draft;
  const room = { type: x.type, platforms: x.platforms.slice(), genres: x.genres.slice(), decades: x.decades.slice(),
    director: x.director, tier: x.tier, by: S.me || "solo", at: Date.now() };
  if (S.solo) { store.set("cinematch:solo-room", room); S.myVotes.SOLO = {}; return enterRoom("SOLO", room); }
  let code = newCode();
  try {
    for (let i = 0; i < 5 && (await S.db.doc("rooms/" + code).get()).exists; i++) code = newCode();
    await S.db.doc("rooms/" + code).set(room);
    enterRoom(code, room);
  } catch (e) { S.screen = "home"; S.err = "Impossible de créer le salon. Demandez à la personne qui a partagé la page un accès « Contributeur »."; render(); }
}

async function joinRoom(code) {
  if (!/^[A-Z]{4}$/.test(code)) { S.err = "Le code fait 4 lettres."; return render(); }
  try {
    const d = await S.db.doc("rooms/" + code).get();
    if (!d.exists) { S.err = `Aucun salon ${code}. Vérifiez le code avec vos amis.`; return render(); }
    S.err = ""; enterRoom(code, d.data());
  } catch { S.err = "Connexion impossible pour le moment. Réessayez."; render(); }
}

// Une écriture à la fois : on garde toujours la dernière version à envoyer.
let saving = false, pending = false;
async function saveVotes() {
  if (S.solo) { store.set("cinematch:solo-votes", S.myVotes); return; }
  if (saving) { pending = true; return; }
  saving = true;
  try { await S.db.doc("votes/" + S.me).set({ rooms: S.myVotes }); } catch {}
  saving = false;
  if (pending) { pending = false; saveVotes(); }
}

// ---------- Démarrage ----------
(async function start() {
  render();
  const hasClaude = typeof window.claude?.use === "function";
  const [db, user] = hasClaude ? await Promise.all([window.claude.use("db"), window.claude.use("user")]) : [null, null];
  S.db = db; S.user = user;
  S.me = user ? await user.id() : null;
  if (!db || !S.me) {
    S.solo = true; S.me = "moi";
    S.myVotes = store.get("cinematch:solo-votes") || {};
  } else {
    try { Object.assign(S.profiles, await user.profiles([S.me])); } catch {}
    try { const mine = await db.doc("votes/" + S.me).get(); S.myVotes = mine.data()?.rooms || {}; } catch {}
  }
  S.ready = true;
  const last = store.get("cinematch:last");
  if (last === "SOLO" && S.solo && store.get("cinematch:solo-room")) enterRoom("SOLO", store.get("cinematch:solo-room"));
  else if (last && !S.solo) await joinRoom(last).then(() => { if (S.screen !== "room") { S.err = ""; render(); } });
  else render();
})();
</script>

</body>
